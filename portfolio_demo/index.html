<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live ASL Hand Sign Interpreter</title>
  <style>
    /* Minimal, self-contained styles scoped to .sign-demo so you can drop this into any portfolio */
    .sign-demo {
      max-width: 640px;
      margin: 2rem auto;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 1.25rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
    }

    .sign-demo__stage {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #020617;
      border-radius: 12px;
      overflow: hidden;
    }

    .sign-demo__video,
    .sign-demo__canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* Mirror visually like a selfie camera while feeding raw coordinates to MediaPipe */
      transform: scaleX(-1);
    }

    .sign-demo__canvas {
      pointer-events: none;
    }

    .sign-demo__bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 1rem;
    }

    .sign-demo__readout {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
    }

    .sign-demo__letter {
      font-size: 2.25rem;
      font-weight: 700;
      line-height: 1;
      color: #4ade80;
      min-width: 2.5rem;
      text-align: center;
    }

    .sign-demo__meta {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .sign-demo__confidence {
      font-size: 0.875rem;
      font-weight: 600;
      color: #cbd5e1;
    }

    .sign-demo__status {
      font-size: 0.8rem;
      color: #94a3b8;
    }

    .sign-demo__controls {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .sign-demo__mirror-opt {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.85rem;
      color: #cbd5e1;
      cursor: pointer;
      user-select: none;
    }

    .sign-demo__btn {
      appearance: none;
      border: none;
      border-radius: 10px;
      padding: 0.65rem 1.15rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: #052e16;
      background: #4ade80;
      cursor: pointer;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }

    .sign-demo__btn:hover:not(:disabled) {
      opacity: 0.92;
    }

    .sign-demo__btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .sign-demo__btn:disabled {
      opacity: 0.5;
      cursor: wait;
    }
  </style>
</head>
<body style="margin: 0; background: #020617;">

  <!-- Drop this .sign-demo block anywhere inside your portfolio HTML -->
  <section class="sign-demo" aria-label="Live Sign Language Interpreter Demo">
    <div class="sign-demo__stage">
      <video id="sign-video" class="sign-demo__video" autoplay playsinline muted></video>
      <canvas id="sign-canvas" class="sign-demo__canvas"></canvas>
    </div>

    <div class="sign-demo__bar">
      <div class="sign-demo__readout">
        <span id="sign-letter" class="sign-demo__letter">—</span>
        <div class="sign-demo__meta">
          <span id="sign-confidence" class="sign-demo__confidence">0%</span>
          <span id="sign-status" class="sign-demo__status">Camera off</span>
        </div>
      </div>

      <div class="sign-demo__controls">
        <label class="sign-demo__mirror-opt" title="Enable if signing with your left hand">
          <input type="checkbox" id="sign-left-hand" />
          Left hand
        </label>
        <button id="sign-toggle-btn" class="sign-demo__btn" type="button">
          Start Live Demo
        </button>
      </div>
    </div>
  </section>

  <script type="module">
    import { createSignInterpreter } from "./sign-demo.js";

    createSignInterpreter({
      videoEl: document.getElementById("sign-video"),
      canvasEl: document.getElementById("sign-canvas"),
      toggleBtn: document.getElementById("sign-toggle-btn"),
      letterEl: document.getElementById("sign-letter"),
      confidenceEl: document.getElementById("sign-confidence"),
      statusEl: document.getElementById("sign-status"),
      leftHandCheckbox: document.getElementById("sign-left-hand"),
      modelUrl: "./model.json",
    });
  </script>
</body>
</html>
